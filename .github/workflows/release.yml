name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          find target/${{ matrix.target }}/release/bundle -type f \( \
            -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o \
            -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \
          \) -exec cp {} upload/ \; 2>/dev/null || true
          ls -lh upload/ || echo "No files"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onemarkdown-${{ matrix.label }}
          path: upload/
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List files
        run: find artifacts -type f | sort

      - name: Create release and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          TAG="${GITHUB_REF#refs/tags/}"
          
          # Create release
          RELEASE_ID=$(curl -sf -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"OneMarkdown $TAG\",\"draft\":true,\"body\":\"Release $TAG\"}" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          
          echo "Release ID: $RELEASE_ID"
          
          # Get upload URL
          UPLOAD_URL=$(curl -sf \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['upload_url'].replace('{?name,label}',''))")
          
          echo "Upload URL: $UPLOAD_URL"
          
          # Upload each file
          for f in $(find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \)); do
            NAME=$(basename "$f")
            echo "Uploading $NAME..."
            curl -sf -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "${UPLOAD_URL}?name=$NAME" || echo "Failed: $NAME"
          done
          
          echo "Done!"
