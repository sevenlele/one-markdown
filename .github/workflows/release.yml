name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          find target/${{ matrix.target }}/release/bundle -type f \( \
            -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o \
            -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \
          \) -exec cp {} upload/ \; 2>/dev/null || true
          echo "=== Collected files ==="
          ls -lh upload/ || echo "No files collected"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onemarkdown-${{ matrix.label }}
          path: upload/
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: |
          echo "=== All files in artifacts/ ==="
          find artifacts -type f | sort
          echo "=== Sizes ==="
          du -sh artifacts/

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: *** secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          REPO="${GITHUB_REPOSITORY}"
          echo "Creating release for tag=$TAG repo=$REPO"

          # Step 1: Create release via API
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/releases" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"OneMarkdown $TAG\",
              \"draft\": true,
              \"prerelease\": false,
              \"body\": \"## OneMarkdown $TAG\n\n**Single-file Markdown editor with AI.** Open, write, publish.\n\n### Features\n- Single-file workflow (no Vault)\n- AI assistant (explain/rewrite/translate/summarize)\n- KaTeX math, Mermaid diagrams, Callouts, TOC\n- Light/dark themes\n- ~5MB install, <100ms startup\"
            }")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin).get('upload_url','').replace('{?name,label}',''))" 2>/dev/null || echo "")

          echo "Release ID: $RELEASE_ID"
          echo "Upload URL: $UPLOAD_URL"

          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: Failed to create release!"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

          # Step 2: Upload each asset
          for FILE in $(find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \)); do
            FILENAME=$(basename "$FILE")
            FILESIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")
            echo "Uploading: $FILENAME ($FILESIZE bytes)"

            curl -s -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "${UPLOAD_URL}?name=$FILENAME" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print(f'  -> {d.get(\"name\",\"ERROR\")} ({d.get(\"size\",0)//1024}KB)')
          " 2>/dev/null || echo "  -> Upload failed for $FILENAME"
          done

          echo ""
          echo "=== Release created ==="
          echo "https://github.com/$REPO/releases/tag/$TAG"
