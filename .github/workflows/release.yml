name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build
        run: cargo tauri build --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p upload
          find target/${{ matrix.target }}/release/bundle -type f \( \
            -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o \
            -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \
          \) -exec cp {} upload/ \; 2>/dev/null || true
          ls -la upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onemarkdown-${{ matrix.label }}
          path: upload/
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "=== Downloaded files ==="
          find artifacts -type f | sort
          echo "=== Total size ==="
          du -sh artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Creating release for tag: $TAG"
          
          # Collect all release files
          FILES=$(find artifacts -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.exe" \) | sort)
          echo "Release files:"
          echo "$FILES"
          
          if [ -z "$FILES" ]; then
            echo "WARNING: No release files found!"
            exit 1
          fi
          
          # Create release with gh CLI
          gh release create "$TAG" \
            --repo "sevenlele/one-markdown" \
            --title "OneMarkdown $TAG" \
            --notes "## OneMarkdown $TAG

          **Single-file Markdown editor with AI.** Open, write, publish.

          ### Features
          - Single-file Markdown workflow (no Vault needed)
          - AI assistant (explain, rewrite, translate, summarize)
          - KaTeX math, Mermaid diagrams, Callouts
          - Light/dark themes
          - ~5MB install, <100ms startup" \
            --draft \
            $FILES
          
          echo "Release created!"
