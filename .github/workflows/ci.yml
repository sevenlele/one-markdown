name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Clippy
        run: |
          cargo clippy --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          count = 0
          for line in sys.stdin:
              try:
                  msg = json.loads(line)
                  if msg.get('reason') == 'compiler-message':
                      m = msg['message']
                      if m.get('level') in ('warning', 'error'):
                          spans = m.get('spans', [])
                          if spans:
                              s = spans[0]
                              print(f\"::warning file={s.get('file_name','?')},line={s.get('line_start',0)},title={m.get('code',{}).get('code','')}::{m['message']}\")
                              count += 1
              except:
                  pass
          if count > 0:
              print(f'\n{count} clippy warning(s) found', file=sys.stderr)
              sys.exit(1)
          "

      - name: Test
        run: cargo test

      - name: Build check
        run: cargo tauri build --debug --no-bundle
