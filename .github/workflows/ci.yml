name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Clippy
        run: |
          # Run clippy with JSON output to extract warnings
          cargo clippy --message-format=json 2>/dev/null | python3 -c "
          import json, sys
          warnings = []
          for line in sys.stdin:
              try:
                  msg = json.loads(line)
                  if msg.get('reason') == 'compiler-message':
                      m = msg['message']
                      if m.get('level') in ('warning', 'error'):
                          spans = m.get('spans', [])
                          if spans:
                              s = spans[0]
                              fname = s.get('file_name', '?')
                              line_no = s.get('line_start', 0)
                              text = m['message']
                              lint = m.get('code', {}).get('code', '')
                              print(f'::warning file={fname},line={line_no},title={lint}::{text}')
                              warnings.append(text)
              except:
                  pass
          if warnings:
              print(f'\nFound {len(warnings)} clippy warning(s)', file=sys.stderr)
              sys.exit(1)
          "

      - name: Test
        run: cargo test

      - name: Build check
        run: cargo tauri build --debug --no-bundle
