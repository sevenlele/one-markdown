<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMarkdown</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ─── Toolbar ─────────────────────────────────────────── -->
  <header id="toolbar">
    <div class="toolbar-group">
      <button id="btn-new" class="tb" title="New (Ctrl+N)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1h8l4 4v9a1 1 0 01-1 1H2a1 1 0 01-1-1V2a1 1 0 011-1zm7 0v4h4"/><path d="M7 8v4M5 10h4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button id="btn-open" class="tb" title="Open (Ctrl+O)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 14h11a1 1 0 001-1V6a1 1 0 00-1-1H8L6.5 3H1.5a1 1 0 00-1 1v9a1 1 0 001 1z"/></svg>
      </button>
      <button id="btn-save" class="tb" title="Save (Ctrl+S)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M13 15H3a1 1 0 01-1-1V2a1 1 0 011-1h7l4 4v9a1 1 0 01-1 1zM9 1v4h3M5 10h6M5 13h6"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btn-bold" class="tb" title="Bold (Ctrl+B)"><b>B</b></button>
      <button id="btn-italic" class="tb" title="Italic (Ctrl+I)"><i>I</i></button>
      <button id="btn-strike" class="tb" title="Strikethrough"><s>S</s></button>
      <button id="btn-code" class="tb" title="Code">&lt;/&gt;</button>
      <span class="sep"></span>
      <button id="btn-h1" class="tb" title="Heading 1">H1</button>
      <button id="btn-h2" class="tb" title="Heading 2">H2</button>
      <button id="btn-h3" class="tb" title="Heading 3">H3</button>
      <span class="sep"></span>
      <button id="btn-link" class="tb" title="Link (Ctrl+K)">🔗</button>
      <button id="btn-image" class="tb" title="Image">🖼</button>
      <button id="btn-list" class="tb" title="Bullet list">•</button>
      <button id="btn-olist" class="tb" title="Numbered list">1.</button>
      <button id="btn-quote" class="tb" title="Blockquote">"</button>
      <button id="btn-hr" class="tb" title="Horizontal rule">—</button>
      <button id="btn-table" class="tb" title="Table">▦</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-recent" class="tb" title="Recent files">📁</button>
      <button id="btn-ai" class="tb tb-accent" title="AI Assistant (Ctrl+L)">✨ AI</button>
      <button id="btn-export" class="tb" title="Export HTML">Export</button>
      <button id="btn-settings" class="tb" title="Settings">⚙</button>
      <button id="btn-theme" class="tb" title="Toggle theme">🌙</button>
      <span id="file-title" class="file-name">Untitled</span>
    </div>
  </header>

  <!-- ─── Search bar (hidden by default) ──────────────────── -->
  <div id="search-bar" class="search-bar hidden">
    <div class="search-row">
      <input id="search-input" type="text" placeholder="Search..." autocomplete="off">
      <label class="search-opt"><input type="checkbox" id="search-regex"> .* </label>
      <label class="search-opt"><input type="checkbox" id="search-case"> Aa </label>
      <span id="search-count" class="search-count">0/0</span>
      <button id="search-prev" class="tb tb-sm" title="Previous (Shift+Enter)">▲</button>
      <button id="search-next" class="tb tb-sm" title="Next (Enter)">▼</button>
      <button id="search-close" class="tb tb-sm" title="Close (Esc)">✕</button>
    </div>
    <div id="replace-row" class="search-row">
      <input id="replace-input" type="text" placeholder="Replace..." autocomplete="off">
      <button id="replace-one" class="tb tb-sm" title="Replace">Replace</button>
      <button id="replace-all" class="tb tb-sm" title="Replace All">All</button>
    </div>
  </div>

  <!-- ─── Recent files panel (hidden) ─────────────────────── -->
  <div id="recent-panel" class="panel hidden">
    <div class="panel-header">
      <span>Recent Files</span>
      <button id="recent-close" class="tb tb-sm">✕</button>
    </div>
    <div id="recent-list" class="panel-list"></div>
  </div>

  <!-- ─── Settings panel (hidden) ─────────────────────────── -->
  <div id="settings-panel" class="panel panel-wide hidden">
    <div class="panel-header">
      <span>⚙ Settings</span>
      <button id="settings-close" class="tb tb-sm">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-section">
        <h3>Editor</h3>
        <label>Font size <input type="number" id="set-font-size" min="10" max="24" value="15"> px</label>
        <label>Tab size <input type="number" id="set-tab-size" min="2" max="8" value="4"> spaces</label>
        <label><input type="checkbox" id="set-word-wrap" checked> Word wrap</label>
        <label><input type="checkbox" id="set-auto-save" checked> Auto save</label>
      </div>
      <div class="settings-section">
        <h3>Images</h3>
        <label>
          <select id="set-image-strategy">
            <option value="inline">Inline (base64 in .md)</option>
            <option value="assetDir" selected>Asset dir (.assets/)</option>
          </select>
        </label>
      </div>
      <div class="settings-section">
        <h3>AI</h3>
        <label>API Endpoint <input type="text" id="set-ai-endpoint" placeholder="https://api.openai.com/v1"></label>
        <label>API Key <input type="password" id="set-ai-key" placeholder="sk-..."></label>
        <label>Model <input type="text" id="set-ai-model" placeholder="gpt-4o-mini"></label>
      </div>
      <div class="settings-actions">
        <button id="settings-save" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- ─── AI Panel (hidden) ───────────────────────────────── -->
  <div id="ai-panel" class="ai-panel hidden">
    <div class="ai-panel-header">
      <span>✨ AI Assistant</span>
      <button id="ai-close" class="tb tb-sm">✕</button>
    </div>
    <div class="ai-actions">
      <button class="ai-btn" data-action="explain">📖 Explain</button>
      <button class="ai-btn" data-action="summarize">📝 Summarize</button>
      <button class="ai-btn" data-action="translate">🌐 Translate</button>
      <button class="ai-btn" data-action="rewrite">✏️ Rewrite</button>
      <button class="ai-btn" data-action="context">📦 Context Bundle</button>
    </div>
    <div id="ai-output" class="ai-output"></div>
  </div>

  <!-- ─── Main editor ─────────────────────────────────────── -->
  <main id="main">
    <div id="editor-pane" class="pane">
      <div class="pane-label">Editor</div>
      <textarea id="editor" spellcheck="false" placeholder="Start writing..."></textarea>
    </div>
    <div id="resizer" class="resizer"></div>
    <div id="preview-pane" class="pane">
      <div class="pane-label">Preview</div>
      <div id="preview"></div>
    </div>
  </main>

  <!-- ─── Status bar ──────────────────────────────────────── -->
  <footer id="statusbar">
    <span id="st-file">No file</span>
    <span id="st-words">0 words</span>
    <span id="st-chars">0 chars</span>
    <span id="st-lines">0 lines</span>
    <span id="st-read-time">~0 min read</span>
    <span id="st-cursor">Ln 1, Col 1</span>
    <span id="st-auto-saved" class="st-saved"></span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
