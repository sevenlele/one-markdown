<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OneMarkdown</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ─── Toolbar ─────────────────────────────────────────── -->
  <header id="toolbar">
    <div class="toolbar-group">
      <button id="btn-new" class="tb" title="New (Ctrl+N)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M2 1h8l4 4v9a1 1 0 01-1 1H2a1 1 0 01-1-1V2a1 1 0 011-1zm7 0v4h4"/><path d="M7 8v4M5 10h4" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
      <button id="btn-open" class="tb" title="Open (Ctrl+O)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 14h11a1 1 0 001-1V6a1 1 0 00-1-1H8L6.5 3H1.5a1 1 0 00-1 1v9a1 1 0 001 1z"/></svg>
      </button>
      <button id="btn-save" class="tb" title="Save (Ctrl+S)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M13 15H3a1 1 0 01-1-1V2a1 1 0 011-1h7l4 4v9a1 1 0 01-1 1zM9 1v4h3M5 10h6M5 13h6"/></svg>
      </button>
      <span class="sep"></span>
      <button id="btn-bold" class="tb" title="Bold (Ctrl+B)"><b>B</b></button>
      <button id="btn-italic" class="tb" title="Italic (Ctrl+I)"><i>I</i></button>
      <button id="btn-strike" class="tb" title="Strikethrough"><s>S</s></button>
      <button id="btn-code" class="tb" title="Code">&lt;/&gt;</button>
      <span class="sep"></span>
      <button id="btn-h1" class="tb" title="Heading 1">H1</button>
      <button id="btn-h2" class="tb" title="Heading 2">H2</button>
      <button id="btn-h3" class="tb" title="Heading 3">H3</button>
      <span class="sep"></span>
      <button id="btn-link" class="tb" title="Link (Ctrl+K)">🔗</button>
      <button id="btn-image" class="tb" title="Image">🖼</button>
      <button id="btn-list" class="tb" title="Bullet list">•</button>
      <button id="btn-olist" class="tb" title="Numbered list">1.</button>
      <button id="btn-quote" class="tb" title="Blockquote">"</button>
      <button id="btn-hr" class="tb" title="Horizontal rule">—</button>
      <button id="btn-table" class="tb" title="Table">▦</button>
    </div>
    <div class="toolbar-group">
      <button id="btn-ai" class="tb tb-accent" title="AI Assistant (Ctrl+L)">✨ AI</button>
      <button id="btn-export" class="tb" title="Export HTML">Export</button>
      <span id="file-title" class="file-name">Untitled</span>
    </div>
  </header>

  <!-- ─── AI Panel (hidden by default) ────────────────────── -->
  <div id="ai-panel" class="ai-panel hidden">
    <div class="ai-panel-header">
      <span>✨ AI Assistant</span>
      <button id="ai-close" class="tb tb-sm">✕</button>
    </div>
    <div class="ai-actions">
      <button class="ai-btn" data-action="explain">📖 Explain</button>
      <button class="ai-btn" data-action="summarize">📝 Summarize</button>
      <button class="ai-btn" data-action="translate">🌐 Translate</button>
      <button class="ai-btn" data-action="rewrite">✏️ Rewrite</button>
      <button class="ai-btn" data-action="context">📦 Context Bundle</button>
    </div>
    <div id="ai-output" class="ai-output"></div>
  </div>

  <!-- ─── Main editor ─────────────────────────────────────── -->
  <main id="main">
    <div id="editor-pane" class="pane">
      <div class="pane-label">Editor</div>
      <textarea id="editor" spellcheck="false" placeholder="Start writing..."></textarea>
    </div>
    <div id="resizer" class="resizer"></div>
    <div id="preview-pane" class="pane">
      <div class="pane-label">Preview</div>
      <div id="preview"></div>
    </div>
  </main>

  <!-- ─── Status bar ──────────────────────────────────────── -->
  <footer id="statusbar">
    <span id="st-file">No file</span>
    <span id="st-words">0 words</span>
    <span id="st-chars">0 chars</span>
    <span id="st-lines">0 lines</span>
    <span id="st-cursor">Ln 1, Col 1</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
